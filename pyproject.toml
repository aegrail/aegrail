[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegrail"
version = "0.2.4"
description = "The runtime contract for AI agents in production."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Arpit Nigam", email = "arpit.nigam.maverick@gmail.com" }]
maintainers = [{ name = "Arpit Nigam", email = "arpit.nigam.maverick@gmail.com" }]
keywords = ["ai", "agents", "llm", "governance", "runtime", "audit", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/arpitcoder/aegrail"
Repository = "https://github.com/arpitcoder/aegrail"
Issues = "https://github.com/arpitcoder/aegrail/issues"

[tool.hatch.build.targets.wheel]
packages = ["aegrail"]

[tool.hatch.build.targets.sdist]
include = [
    "/aegrail",
    "/examples",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/COMPLIANCE.md",
    "/ARCHITECTURE.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.gitignore",
    "/.github",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
